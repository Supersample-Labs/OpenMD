name: Publish Windows and macOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - windows/**
      - macOS/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: openmd-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          version = ET.parse('windows/OpenMD.csproj').findtext('.//Version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile editor checks
        run: dotnet build windows/Checks/OpenMD.Checks.csproj -c Release
      - name: Build portable Windows application
        run: dotnet publish windows/OpenMD.csproj -c Release -r win-x64 --self-contained true -o release/OpenMD
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path release/OpenMD/* -DestinationPath OpenMD-${{ needs.version.outputs.version }}-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: OpenMD-*-win-x64.zip

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon application
        run: zsh macOS/scripts/build-macos-app.sh
      - name: Verify and package
        run: |
          codesign --verify --deep --strict macOS/dist/OpenMD.app
          lipo macOS/dist/OpenMD.app/Contents/MacOS/OpenMD -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent macOS/dist/OpenMD.app OpenMD-${{ needs.version.outputs.version }}-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: OpenMD-*-macOS-arm64.zip

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release
      - name: Publish release with both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Mermaid starter diagrams are now available from the top menu and toolbar on Windows and macOS: Flowchart, Sequence, Class, State, Entity relationship, Gantt, Pie, and Mind map.

          Templates insert a fenced Mermaid block and select its source for editing. macOS inserts at the cursor and supports Undo. Windows also includes Wrap selection as Mermaid. Both platforms retain bundled offline diagram rendering.

          Downloads:
          - Windows x64: extract the entire ZIP and run OpenMD.exe. .NET is included; Microsoft Edge WebView2 Runtime is required.
          - macOS Apple Silicon: extract OpenMD.app and move it to Applications. Requires macOS 14 or later. The app is signed for local use (ad hoc), not Developer ID signed or notarized.

          Validation: Windows application and check project compiled; macOS application built and its signature verified. Native macOS insertion, selection, document synchronization, and Undo were checked for all eight templates during development. Windows UI checks were not executed on the development Mac.

          Both platform sources are included in the automatic source archives below.
          NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --title "OpenMD $VERSION — Mermaid diagram menus for Windows and macOS" --notes-file notes.md --draft
          gh release upload "$tag" release/*.zip
          gh release edit "$tag" --draft=false --latest
